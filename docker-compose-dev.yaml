version: '3.8'

services:
  zoka-database:
    image: postgres:16-alpine
    container_name: zoka-database
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - zoka-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zoka-network

  zoka-minio:
    image: minio/minio:latest
    container_name: zoka-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DOMAIN=${MINIO_DOMAIN}  
      - MINIO_SERVER_URL=http://${MINIO_EXTERNAL_ENDPOINT}
    ports:
      - "9000:9000"  
      - "9001:9001" 
    volumes:
      - zoka-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - zoka-network

  zoka-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: zoka-api-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - LOG_LEVEL=${LOG_LEVEL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - MINIO_USE_SSL=false
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_STARTTLS=${MAIL_STARTTLS}
      - MAIL_SSL_TLS=${MAIL_SSL_TLS}
      - MAIL_USE_CREDENTIALS=${MAIL_USE_CREDENTIALS}
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./logs:/app/logs
    env_file: .env
    depends_on:
      zoka-database:
        condition: service_healthy
      zoka-minio:
        condition: service_healthy
      zoka-mailhog:
        condition: service_started

    networks:
      - zoka-network

  zoka-adminer:
    image: adminer
    container_name: zoka-adminer
    environment:
      - ADMINER_DEFAULT_DB_DRIVER=${DATABASE_DRIVER}
      - ADMINER_DEFAULT_DB_HOST=${DATABASE_HOST}
      - ADMINER_DEFAULT_DB_USER=${DATABASE_USER}
      - ADMINER_DEFAULT_DB_PASSWORD=${DATABASE_PASSWORD}
      - ADMINER_DEFAULT_DB_NAME=${DATABASE_NAME}
    ports:
      - "5000:8080"
    depends_on:
      zoka-database:
        condition: service_healthy
    networks:
      - zoka-network

  zoka-mailhog:
      image: mailhog/mailhog:latest
      container_name: zoka-mailhog
      ports:
        - "1025:1025"  
        - "8025:8025"  
      networks:
        - zoka-network

volumes:
  zoka-db-data:
  zoka-minio-data:

networks:
  zoka-network:
    driver: bridge